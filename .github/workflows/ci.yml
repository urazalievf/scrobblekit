name: CI

on:
  push:
  workflow_dispatch:

jobs:
  core-tests:
    name: ScrobbleCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: swift test
        run: swift test

  app-builds:
    name: Build ${{ matrix.scheme }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: ScrobbleKitMac
            destination: generic/platform=macOS
          - scheme: ScrobbleKitiOS
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v4
      - name: Build (no signing, no device)
        run: |
          xcodebuild build \
            -project Apps/ScrobbleKit.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
