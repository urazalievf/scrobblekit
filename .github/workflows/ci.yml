name: CI

on:
  push:
  workflow_dispatch:

jobs:
  core-tests:
    name: ScrobbleCore tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: xcodebuild -version && swift --version
      - name: swift test
        run: swift test
      - name: Siri text never says "Apple"
        # App Store Connect rejects a build whose App Intent titles,
        # descriptions or phrases contain "Apple" (error 90626).
        run: |
          if grep -rni "apple" Apps/*/AppIntents; then
            echo "::error::App Intent text must not contain 'Apple'"
            exit 1
          fi

  app-builds:
    name: Build ${{ matrix.scheme }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - scheme: ScrobbleKitMac
            destination: generic/platform=macOS
          - scheme: ScrobbleKitiOS
            destination: generic/platform=iOS Simulator
    steps:
      - uses: actions/checkout@v4
      - name: Build (no signing, no device)
        run: |
          xcodebuild build \
            -project Apps/ScrobbleKit.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
